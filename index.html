<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juan Escobar | Desarrollador web</title>
    <script>
      document.documentElement.classList.add('js')
      try {
        if (sessionStorage.getItem('portfolio:loader-seen')) {
          document.documentElement.dataset.loader = 'skip'
        }
      } catch (e) {}
    </script>
    <noscript
      ><style>
        .loader-wrap {
          display: none;
        }
      </style></noscript
    >
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
